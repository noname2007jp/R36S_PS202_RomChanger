name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build single-file executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PS202_ROM_Gamelist_Builder main.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS202_ROM_Gamelist_Builder-Windows
          path: dist/PS202_ROM_Gamelist_Builder.exe
